name: Build

on: [push, pull_request]

jobs:
  test:
    name: Test with MySQL ${{ matrix.mysql }}, Ruby ${{ matrix.ruby }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        mysql: ['5.7', '8.0']
        ruby: ['3.1', '3.2', '3.3', '3.4']
    services:
      mysql:
        image: mysql:${{ matrix.mysql }}
        env:
          MYSQL_ROOT_PASSWORD: root
        ports:
          - 3306:3306
        options: >-
          --health-cmd "mysqladmin ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
    - uses: actions/checkout@v4
    - name: Install PostgreSQL client libraries
      run: sudo apt-get update && sudo apt-get install -y libpq-dev
    - name: Set up Ruby
      uses: ruby/setup-ruby@v1
      with:
        ruby-version: ${{ matrix.ruby }}
        bundler-cache: true
    - name: Install dependencies
      run: bundle install
    - name: Prepare database
      run: bundle exec rake db:convergence:prepare
    - name: Prepare PostgreSQL database
      run: bundle exec rake db:convergence:postgres:prepare
    - name: Run tests
      run: bundle exec rake spec
